# Qwen2.5-VL-3B QLoRA (4B klasa) — LICENCA ODOBRENA 2026-11-20 (Qwen Research License prihvacena za projekt).
# Recept po lekcijama v1-v10: kratko (max 40 koraka), lr 2e-5, r16, frozen visual tower.
# gated: false (odobreno 2026-11-20)
base_model: Qwen/Qwen2.5-VL-3B-Instruct
method: qlora-4bit
lora: {r: 16, alpha: 32, dropout: 0.05, target: all-linear}
freeze_vision_encoder: true
lr: 2.0e-5
epochs: 1
max_steps: 40
save_steps: 20
effective_batch: 32
max_length: null # ne truncirati — TRL briše image tokene
eval_proxy: [xm3600-hr, postocr-sr]
held_out: BH-Language-AI/bs-vision-ocr-heldout-v01 # NIKAD u train
gated: true # pravna provjera + odobrenje obavezni
