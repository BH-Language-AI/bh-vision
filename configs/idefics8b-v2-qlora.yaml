# Idefics3-8B QLoRA v2 — prosireni mix (lekcija: kratko, max 40 koraka).
# synth11: 7135 (synth10 5535 + fzs 108 + plotqa-bs2 1500, chart ~51%).
# Cilj: pomaknuti 8B s 36.4%/23.3% pravom raznolikoscu dokumenata.
base_model: HuggingFaceM4/Idefics3-8B-Llama3
method: qlora-4bit
lora: {r: 16, alpha: 32, dropout: 0.05, target: all-linear}
freeze_vision_encoder: true
lr: 2.0e-5
epochs: 1
max_steps: 40
save_steps: 20
effective_batch: 32
max_length: null # ne truncirati — TRL briše image tokene
eval_proxy: [xm3600-hr, postocr-sr]
held_out: BH-Language-AI/bs-vision-ocr-heldout-v01 # NIKAD u train
gated: false # odobreno 2026-11-21
