# SmolVLM2-2.2B QLoRA v8 — isto kao v3/v5/v7 recept (lr 2e-5, r16, frozen, 1 epoha),
# trening synth8 (5427 uzoraka: synth5 2902 + bhas-bulk 1825 + plotqa-bs 700, chart 39.6%).
# Najveći i najraznolikiji mix dosad; eval v03-val + held-out v01.
base_model: HuggingFaceTB/SmolVLM2-2.2B-Instruct
method: qlora-4bit
lora: {r: 16, alpha: 32, dropout: 0.05, target: all-linear}
freeze_vision_encoder: true
lr: 2.0e-5
epochs: 1
save_steps: 30
effective_batch: 32
max_length: null # ne truncirati — TRL briše image tokene
eval_proxy: [xm3600-hr, postocr-sr]
held_out: BH-Language-AI/bs-vision-ocr-heldout-v01 # NIKAD u train
