# SmolVLM2-2.2B QLoRA v2 — ODLEDJEN vision encoder (v1 sa zamrznutim je memorizirao odgovore: eval 12% < baseline 37%)
base_model: HuggingFaceTB/SmolVLM2-2.2B-Instruct
method: qlora-4bit
lora: {r: 32, alpha: 64, dropout: 0.1, target: all-linear}
freeze_vision_encoder: false
lr: 1.0e-4
epochs: 1
effective_batch: 32
max_length: null # ne truncirati — TRL briše image tokene
eval_proxy: [xm3600-hr, postocr-sr]
held_out: BH-Language-AI/bs-vision-ocr-heldout-v01 # NIKAD u train
