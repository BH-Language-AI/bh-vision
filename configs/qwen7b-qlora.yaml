# Qwen2.5-VL-7B QLoRA (8B klasa, produkcijski kandidat) — pilot po nalogu vlasnika 2026-11-24.
# Licenca: karta tvrdi apache-2.0 (NEMA LICENSE fajla); 3B brat ima Qwen Research License (vec odobren).
# Idefics3 se pokazao losim dvaput — ista Qwen porodica koja pobijedjuje, veca klasa.
# Recept: kratko (max 40 koraka), lr 2e-5, r16, frozen visual tower, synth7.
base_model: Qwen/Qwen2.5-VL-7B-Instruct
method: qlora-4bit
lora: {r: 16, alpha: 32, dropout: 0.05, target: all-linear}
freeze_vision_encoder: true
lr: 2.0e-5
epochs: 1
max_steps: 40
save_steps: 20
effective_batch: 32
max_length: null # ne truncirati — TRL briše image tokene
eval_proxy: [xm3600-hr, postocr-sr]
held_out: BH-Language-AI/bs-vision-ocr-heldout-v01 # NIKAD u train
gated: false # odobreno 2026-11-24 (produkcijska 8B)
