# SmolVLM2-2.2B QLoRA v9 — kratki trening (lekcija v1-v8: broj koraka ubija).
# synth7 (3015: synth5 + bhas 113 pravih dokumenata), max 40 koraka, save 20.
# Cilj: nadmašiti v3 (46.1%/23.3%) kraćim treningom na boljim podacima.
base_model: HuggingFaceTB/SmolVLM2-2.2B-Instruct
method: qlora-4bit
lora: {r: 16, alpha: 32, dropout: 0.05, target: all-linear}
freeze_vision_encoder: true
lr: 2.0e-5
epochs: 1
max_steps: 40
save_steps: 20
effective_batch: 32
max_length: null # ne truncirati — TRL briše image tokene
eval_proxy: [xm3600-hr, postocr-sr]
held_out: BH-Language-AI/bs-vision-ocr-heldout-v01 # NIKAD u train
