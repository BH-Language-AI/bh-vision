[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bh-vision"
version = "0.1.0"
description = "BH-Vision: vizuelni AI za bosanski i Balkan"
requires-python = ">=3.10"
dependencies = ["pillow", "huggingface-hub", "pyyaml"]

[project.optional-dependencies]
# shortcut: transformers>5.22 lomi SmolVLM2 merge (reshape [-1,14,2048]); drzati pin dok se ne provjeri novija verzija.
train = ["torch", "transformers==5.22.2", "trl==1.18.0", "peft==0.21.2", "accelerate", "bitsandbytes", "datasets"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
